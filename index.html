<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표 질의응답 평가</title>
<style>
:root {
  --bg: #f4f5f7; --card: #fff; --line: #dfe2e8; --text: #1d2330; --sub: #667085; --accent: #2b4c9b;
  --apply: #1a7f4b; --understand: #2f6fde; --mis: #d1453b; --unknown: #d99a00; --na: #b8bcc4;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; }
header .ctx { color: var(--sub); font-size: 13px; margin-left: 16px; }
nav { display: flex; gap: 4px; padding: 0 20px; background: var(--card); border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { border: 0; background: none; padding: 12px 14px; font: inherit; color: var(--sub); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
nav button.on { color: var(--accent); border-color: var(--accent); font-weight: 600; }
nav button.done { background: #e6f4ec; color: var(--apply); }
nav button.done.on { color: var(--apply); border-color: var(--apply); }
main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 60px; }
section { display: none; }
section.on { display: block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
.card h2 { font-size: 16px; margin: 0 0 12px; }
.card h3 { font-size: 14px; margin: 14px 0 6px; }
label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
input[type=text], input[type=password], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; color: var(--text); }
textarea { min-height: 90px; resize: vertical; }
button.btn { border: 1px solid var(--line); background: #fff; color: var(--text); padding: 7px 14px; border-radius: 7px; font: inherit; cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.btn:disabled { opacity: .55; cursor: wait; }
button.btn.rec { background: var(--mis); border-color: var(--mis); color: #fff; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 180px; }
.hint { color: var(--sub); font-size: 13px; font-weight: 400; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; min-width: 150px; border: 0; border-right: 1px solid var(--line); background: #fff; padding: 9px 10px; font: inherit; color: var(--sub); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
.mode { margin: 12px 0 4px; }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; color: #fff; background: var(--na); margin-right: 4px; white-space: nowrap; }
.chip.t { background: #eef1f6; color: var(--text); }
.s-apply { background: var(--apply); } .s-understand { background: var(--understand); }
.s-mis { background: var(--mis); } .s-unknown { background: var(--unknown); } .s-na { background: var(--na); }
.need { color: var(--mis); font-weight: 600; font-size: 13px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: top; }
th { color: var(--sub); font-weight: 500; font-size: 13px; }
tr.pick { cursor: pointer; } tr.pick:hover { background: #f7f8fb; }
details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
summary { cursor: pointer; font-weight: 600; }
.qbox { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.qbox .q { font-weight: 600; margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
svg text { font: 600 12.5px "Malgun Gothic", system-ui, sans-serif; fill: #fff; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
svg .node, svg .edge { cursor: pointer; }
svg .hit { stroke: transparent; stroke-width: 18; cursor: pointer; }
.ev { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 10px 0; }
.ev blockquote { margin: 4px 0; padding: 6px 10px; background: #f6f7fa; border-radius: 6px; }
.modal { position: fixed; inset: 0; background: rgba(20, 25, 40, .45); display: none; align-items: center; justify-content: center; z-index: 10; }
.modal.on { display: flex; }
.modal .card { width: min(480px, 92vw); margin: 0; }
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1d2330; color: #fff; padding: 10px 18px; border-radius: 8px; display: none; max-width: 80vw; z-index: 20; }
pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; background: #f6f7fa; padding: 10px; border-radius: 6px; max-height: 320px; overflow: auto; }
</style>
</head>
<body>
<header>
  <div class="row"><h1>발표 기반 질의응답 평가</h1><span class="ctx" id="ctx"></span></div>
  <button class="btn" onclick="openSettings()">⚙ 설정</button>
</header>
<nav id="nav"></nav>
<main>
  <section id="tab1"></section>
  <section id="tab2"></section>
  <section id="tab3"></section>
  <section id="tab4"></section>
  <section id="tab5"></section>
  <section id="tab6"></section>
</main>

<div class="modal" id="settings">
  <div class="card">
    <h2>설정</h2>
    <label>baze API 키 <span id="keyHint"></span></label>
    <input type="password" id="setKey" placeholder="새 키를 넣을 때만 입력" autocomplete="off">
    <label>채점자 1 모델 <span class="hint">발표 분석, 질문 생성, 피드백 작성도 맡습니다.</span></label>
    <select id="setModel"></select>
    <label>채점자 2 모델</label>
    <div class="row"><select class="grow" id="setModel2"></select><button class="btn" onclick="run(this, loadModels)">전체 목록 불러오기</button></div>
    <label>음성 전사 모델</label>
    <input type="text" id="setStt">
    <p class="hint" id="setMsg"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn" onclick="run(this, testSettings)">저장 후 테스트 호출</button>
      <button class="btn primary" onclick="run(this, async () => { await saveSettings(); closeSettings(); })">저장</button>
      <button class="btn" onclick="closeSettings()">닫기</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/llm.js"></script>
<script src="js/api.js"></script>
<script>
const TABS = ["1. 채점기준표 만들기", "2. 강의 선택 & 채점기준표 넣기", "3. 학생 발표 자료 입력", "4. 질문 생성", "5. 학생 수준 및 피드백", "6. 기록"];
// 판정 항목은 서버(core.py)가 정한다. 개념 7개, 원칙 5개, 두 요소로 된 원칙, 원칙 사이의 관계 10개.
let CONCEPTS = [], PRINCIPLES = [], ELEMENTS = {}, PAIRS = [];
const STATUSES = ["적용 수준", "이해 수준", "오개념", "미확인"];
const CLS = {"적용 수준": "apply", "이해 수준": "understand", "오개념": "mis", "미확인": "unknown"};
const COLOR = {"적용 수준": "#1a7f4b", "이해 수준": "#2f6fde", "오개념": "#d1453b", "미확인": "#d99a00"};
const ABSENT = "#b8bcc4";  // 학생이 말하지 않아 상태표에 없는 항목

const S = { tab: 1, rubrics: [], courses: [], samples: [], settings: {}, extraModels: [], rubric: null, courseId: localStorage.getItem("courseId"), session: null, unit: null,
            draft: null, materials: {name: "", text: ""}, rec: null, scriptAudio: null, ansAudio: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const unitName = u => u.replace("|", " ↔ ");
const chip = st => `<span class="chip s-${CLS[st]}">${st}</span>`;
const course = () => S.courses.find(c => c.id === S.courseId);

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = "none", 5000);
}

// 서버 없이 브라우저 안에서 처리한다(js/api.js).
const api = (path, body) => Engine.api(path, body);

// 버튼을 잠그고 작업을 실행한다. 실패하면 이유를 화면에 알린다.
async function run(btn, fn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "처리 중…";
  try { await fn(); } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = label;
  renderNav();
}

// 입력한 내용 보관. data-keep="이름"이 붙은 칸은 입력할 때마다 S.keep에 저장되고(새로고침해도 남음), 화면을 다시 그릴 때 그 값으로 채운다.
S.keep = (() => { try { return JSON.parse(localStorage.getItem("trace.keep")) || {}; } catch (e) { return {}; } })();
function saveKeep() { try { localStorage.setItem("trace.keep", JSON.stringify(S.keep)); } catch (e) {} }
const kept = k => esc(S.keep[k] ?? "");
function setKeep(k, v) { S.keep[k] = v; saveKeep(); }
document.addEventListener("input", e => {
  const k = e.target.dataset?.keep;
  if (k) setKeep(k, e.target.value);
  if (e.target.closest("#tab1") && S.draft && $("rbName")) collectDraft();  // 채점기준표 수정 중인 내용
});
// 열려 있는 기록. 새로고침해도 다시 연다.
function setSession(s) {
  S.session = s;
  try { s ? localStorage.setItem("trace.sessionId", s.id) : localStorage.removeItem("trace.sessionId"); } catch (e) {}
}

// 탭별 완료 여부. 완료된 탭은 초록색으로 칠한다.
function tabDone(n) {
  const s = S.session;
  return [S.rubrics.some(r => r.id !== "default"), !!course(), !!s, !!s?.finished, !!s?.feedback, false][n - 1];
}
function renderNav() {
  $("nav").innerHTML = TABS.map((t, i) => {
    const done = tabDone(i + 1);
    return `<button class="${i + 1 === S.tab ? "on" : ""} ${done ? "done" : ""}" onclick="show(${i + 1})" title="${done ? "완료" : ""}">${done ? "✓ " : ""}${t}</button>`;
  }).join("");
}

function show(n) {
  S.tab = n;
  renderNav();
  document.querySelectorAll("section").forEach((s, i) => s.classList.toggle("on", i + 1 === n));
  const c = course(), st = S.session?.student;
  $("ctx").textContent = [c && "강의: " + c.name, st && S.session && "학생: " + (st.name || "(이름 없음)")].filter(Boolean).join(" · ");
  [renderRubricTab, renderCourseTab, renderInputTab, renderQuestionTab, renderResultTab, renderRecordTab][n - 1]();
}

// ---------- 설정 ----------
const MODELS = [["claude-sonnet-5-5", "Claude Sonnet 5.5"], ["claude-opus-5-5", "Claude Opus 5.5"], ["claude-haiku-5-5", "Claude Haiku 5.5"],
  ["gpt-6-sol", "GPT-6 Sol"], ["gpt-6.1-terra", "GPT-6.1 Terra"], ["gpt-6-luna", "GPT-6 Luna"], ["gpt-audio-1.5", "GPT Audio 1.5"],
  ["gemini-4-hydrogen", "Gemini 4 Hydrogen"], ["gemini-4-argon", "Gemini 4 Argon"], ["gemini-3.1-pro-preview", "Gemini 3.1 Pro"],
  ["gemini-3.8-flash", "Gemini 3.8 Flash"], ["gemini-3.5-flash-lite", "Gemini 3.5 Flash-Lite"]];
// 기본 모델 목록에 없는 모델 ID는 뒤에 덧붙여 보여준다.
function modelOptions(selected) {
  const known = new Set(MODELS.map(m => m[0]));
  const all = MODELS.concat([...new Set([selected, ...S.extraModels])].filter(id => id && !known.has(id)).map(id => [id, id]));
  return all.map(([id, name]) => `<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${esc(name)}</option>`).join("");
}
function fillModels(s) { $("setModel").innerHTML = modelOptions(s.model); $("setModel2").innerHTML = modelOptions(s.model2); }
// 탭 3의 채점자 선택. 바꾸면 바로 저장한다.
async function saveGraders() {
  try { S.settings = await api("/api/settings", {model: $("g1").value, model2: $("g2").value}); }
  catch (e) { toast(e.message); }
}
async function openSettings() {
  const s = S.settings = await api("/api/settings");
  fillModels(s); $("setStt").value = s.stt_model; $("setKey").value = "";
  $("keyHint").textContent = s.has_key ? "(저장됨, 끝자리 " + s.key_hint + ")" : "(아직 없음)";
  $("setMsg").textContent = "키는 이 브라우저(localStorage)에만 저장되고, baze API에 직접 보냅니다. 공용 컴퓨터에서는 쓰지 마세요.";
  $("settings").classList.add("on");
}
function closeSettings() { $("settings").classList.remove("on"); }
async function saveSettings() {
  const s = S.settings = await api("/api/settings", {api_key: $("setKey").value, model: $("setModel").value, model2: $("setModel2").value, stt_model: $("setStt").value});
  if (S.tab === 3) { $("g1").innerHTML = modelOptions(s.model); $("g2").innerHTML = modelOptions(s.model2); }
  $("setKey").value = ""; $("keyHint").textContent = s.has_key ? "(저장됨, 끝자리 " + s.key_hint + ")" : "(아직 없음)";
}
async function testSettings() {
  await saveSettings();
  $("setMsg").textContent = "테스트 호출 중…";
  try { const r = await api("/api/settings/test", {}); $("setMsg").textContent = "테스트 호출 성공. 모델 응답: " + r.reply; }
  catch (e) { $("setMsg").textContent = "테스트 호출 실패: " + e.message; }
}
async function loadModels() {
  await saveSettings();
  $("setMsg").textContent = "모델 목록을 불러오는 중…";
  try {
    const models = S.extraModels = await api("/api/models");
    fillModels({model: $("setModel").value, model2: $("setModel2").value});
    $("setMsg").textContent = "baze에서 모델 " + models.length + "개를 불러와 선택 목록 뒤에 추가했습니다.";
  } catch (e) { $("setMsg").textContent = "모델 목록을 불러오지 못했습니다: " + e.message; }
}

// ---------- 탭 1: 채점기준표 만들기 ----------
function renderRubricTab() {
  const d = S.draft;
  $("tab1").innerHTML = `
    <div class="card">
      <h2>채점기준표 초안 만들기</h2>
      <label>목표 역량</label>
      <textarea id="rbComp" data-keep="rbComp" placeholder="예: 인공지능 윤리의 핵심 개념을 자신의 전공 사례에 적용해 설명할 수 있다.">${esc(d?.competency || S.keep.rbComp || "")}</textarea>
      <label>수업 자료 폴더 (pdf, pptx, txt, md 파일을 읽습니다. 비워 두면 목표 역량만으로 만듭니다.)</label>
      <div class="row"><input type="file" id="rbFolder" webkitdirectory multiple onchange="pickFolder(this)"><span class="hint" id="rbFolderMsg">${S.rbFiles?.length ? "파일 " + S.rbFiles.length + "개 선택됨" : ""}</span></div>
      <div class="row" style="margin-top:14px">
        <button class="btn primary" onclick="run(this, genRubric)">초안 생성</button>
        <span class="hint">또는 저장된 기준표 불러와 수정:</span>
        <select id="rbLoad" style="width:auto" onchange="loadRubricDraft(this.value)"><option value="">선택</option>${S.rubrics.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join("")}</select>
      </div>
      <p class="hint" id="rbMsg"></p>
    </div>
    ${d ? `<div class="card">
      <h2>채점기준표 수정</h2>
      <div class="row"><input class="grow" type="text" id="rbName" placeholder="채점기준표 이름" value="${esc(d.name || "")}"><button class="btn primary" onclick="run(this, saveRubric)">로컬 저장</button></div>
      <h3>개념 ${CONCEPTS.length}개</h3>${CONCEPTS.map(u => rubricEditor("concepts", u)).join("")}
      <h3>원칙 간 관계 ${PAIRS.length}개</h3>${PAIRS.map(u => rubricEditor("relations", u)).join("")}
    </div>` : ""}`;
}
function rubricEditor(group, unit) {
  const e = S.draft[group][unit], f = (k, label, v) => `<label>${label}</label><textarea data-g="${group}" data-u="${unit}" data-k="${k}" style="min-height:58px">${esc(v)}</textarea>`;
  return `<details><summary>${unitName(unit)}</summary>
    ${f("definition", group === "concepts" ? "정의" : "두 개념의 차이와 관계", e.definition)}
    ${f("understand", "이해 수준 기준", e.understand)}
    ${f("apply", "적용 수준 기준", e.apply)}
    ${f("misconceptions", "흔한 오개념 (한 줄에 하나)", e.misconceptions.join("\n"))}</details>`;
}
function collectDraft() {
  document.querySelectorAll("#tab1 textarea[data-u]").forEach(t => {
    const v = t.value.trim();
    S.draft[t.dataset.g][t.dataset.u][t.dataset.k] = t.dataset.k === "misconceptions" ? v.split("\n").map(x => x.trim()).filter(Boolean) : v;
  });
  S.draft.name = $("rbName").value; S.draft.competency = $("rbComp").value;
}
function pickFolder(input) {
  S.rbFiles = [...input.files].filter(f => /\.(pdf|pptx|txt|md)$/i.test(f.name));
  $("rbFolderMsg").textContent = `읽을 수 있는 파일 ${S.rbFiles.length}개 선택됨`;
}
async function genRubric() {
  const r = await api("/api/rubrics/generate", {competency: $("rbComp").value, files: S.rbFiles || []});
  S.draft = {id: null, name: "", competency: r.competency, concepts: r.concepts, relations: r.relations};
  renderRubricTab();
  $("rbMsg").textContent = `초안을 만들었습니다. 읽은 자료 ${r.files.length}개${r.files.length ? " (" + r.files.join(", ") + ")" : ""}.`
    + (r.filled_from_default.length ? ` 모델이 빠뜨려 임시 기준으로 채운 항목: ${r.filled_from_default.map(unitName).join(", ")}` : "");
}
async function loadRubricDraft(id) {
  if (!id) return;
  const r = await api("/api/rubrics/" + id);
  S.draft = {...r, id: id === "default" ? null : r.id, name: id === "default" ? "" : r.name};
  renderRubricTab();
}
async function saveRubric() {
  collectDraft();
  const r = await api("/api/rubrics", S.draft);
  S.draft.id = r.id; S.rubrics = await api("/api/rubrics"); S.rubric = null;
  toast("저장했습니다: " + r.name + " (이 브라우저에 저장)");
}

// ---------- 탭 2: 강의 선택 ----------
function renderCourseTab() {
  const opts = sel => S.rubrics.map(r => `<option value="${r.id}" ${r.id === sel ? "selected" : ""}>${esc(r.name)}</option>`).join("");
  const c = course();
  $("tab2").innerHTML = `
    <div class="card">
      <h2>강의 선택</h2>
      <label>강의</label>
      <select id="cSel" onchange="onCourseSelect(this.value)">
        ${S.courses.map(x => `<option value="${x.id}" ${x.id === S.courseId ? "selected" : ""}>${esc(x.name)}</option>`).join("")}
        <option value="">직접 작성…</option>
      </select>
      <div class="row" id="cNew" style="display:none;margin-top:10px">
        <input class="grow" type="text" id="cName" placeholder="강의 이름을 직접 입력 (예: 인공지능 윤리 02반)">
        <button class="btn primary" onclick="run(this, addCourse)">목록에 추가하고 선택</button>
      </div>
    </div>
    ${c ? `<div class="card">
      <h2>채점기준표 넣기</h2>

const mb = blob => (blob.size / 1e6).toFixed(1) + "MB";
// 마이크 녹음. baze가 webm을 받지 않아 브라우저에서 wav로 만든다.
async function startMic(onChunk) {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  const ctx = new AudioContext({sampleRate: 16000});
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  proc.onaudioprocess = e => onChunk(new Float32Array(e.inputBuffer.getChannelData(0)));
  ctx.createMediaStreamSource(stream).connect(proc); proc.connect(ctx.destination);
  return {rate: ctx.sampleRate, stop: async () => { stream.getTracks().forEach(t => t.stop()); await ctx.close(); }};
}
// 녹음을 끝내면 onDone(wav 음성)을 부른다. 음성은 전사하지 않고 그대로 첨부된다.
async function toggleRec(btn, onDone) {
  if (S.rec && S.rec.btn !== btn) return toast("다른 녹음이 진행 중입니다.");
  if (!S.rec) {
    try {
      const chunks = [], mic = await startMic(c => chunks.push(c));
      S.rec = {btn, mic, chunks, label: btn.textContent};
      btn.textContent = "■ 녹음 끝내기"; btn.classList.add("rec");
    } catch (e) { toast("마이크를 쓸 수 없습니다: " + e.message); }
    return;
  }
  const {mic, chunks, label} = S.rec; S.rec = null;
  await mic.stop();
  btn.classList.remove("rec"); btn.textContent = label;
  onDone(wavBlob(chunks, mic.rate));
}
// 실시간 받아쓰기. 말하는 동안 전사문이 입력 칸에 들어온다.
async function toggleLive(btn, targetId) {
  if (S.rec && S.rec.btn !== btn) return toast("다른 녹음이 진행 중입니다.");
  if (S.rec) return S.rec.stop();
  try {
    const t = $(targetId), base = t.value ? t.value + "\n" : "", label = btn.textContent;
    let fin = "", ws = null;
    const mic = await startMic(c => { if (ws && ws.readyState === 1) ws.send(Int16Array.from(c, x => Math.max(-1, Math.min(1, x)) * 32767).buffer); });
    try { ws = await Engine.openLiveSocket(mic.rate); } catch (e) { await mic.stop(); throw e; }
    const stop = async () => {
      if (!S.rec || S.rec.btn !== btn) return;
      S.rec = null; await mic.stop();
      if (ws.readyState === 1) ws.send("");  // baze 종료 신호: 빈 텍스트 프레임
      btn.classList.remove("rec"); btn.textContent = label;
    };
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.error || m.error_message) return toast(m.error || "실시간 받아쓰기 오류: " + m.error_message);
      let rest = "";
      for (const k of m.tokens || []) k.is_final ? fin += k.text : rest += k.text;
      t.value = base + fin + rest; t.scrollTop = t.scrollHeight;
      t.dispatchEvent(new Event("input", {bubbles: true}));  // 받아쓴 내용도 보관한다.
    };
    ws.onclose = stop;
    S.rec = {btn, stop};
    btn.textContent = "■ 받아쓰기 끝내기"; btn.classList.add("rec");
  } catch (e) { toast("실시간 받아쓰기를 시작하지 못했습니다: " + e.message); }
}
function wavBlob(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0), v = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((ch, i) => v.setUint8(o + i, ch.charCodeAt(0)));
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (const x of c) { v.setInt16(o, Math.max(-1, Math.min(1, x)) * 32767, true); o += 2; }
  return new Blob([v], {type: "audio/wav"});
}

// 항목마다 채점자 1, 2의 판정을 나란히 보여 준다. 판정이 버려졌거나 미확인으로 둔 경우 그 이유도 보여 준다.
function graderTable(t) {
  const norm = u => Core.normalizeUnit(u);
  const units = Core.UNITS.filter(u => t.by_grader.some(g => g[u]) || t.discarded.some(d => norm(d.unit) === u)
    || (t.grader_raw || []).some(r => r.some(j => norm(j?.unit) === u)));
  if (!units.length) return '<p class="hint">두 채점자 모두 판정한 항목이 없습니다.</p>';
  const confirmed = new Set(t.judgments.map(j => j.unit));
  const cell = (u, gi) => {
    const o = t.by_grader[gi][u], g = t.graders[gi];
    if (o) return `${chip(o.status)}${o.certain ? "" : ' <span class="hint">(확신 낮음)</span>'}<blockquote>“${esc(o.quote)}”</blockquote><div>${esc(o.reason)}</div><details class="hint" style="border:0;padding:0;margin:4px 0 0"><summary style="font-weight:400">근거로 든 채점기준</summary>${esc(o.rubric_item)}</details>`;
    const d = t.discarded.find(x => x.grader === g && norm(x.unit) === u);
    if (d) return `<span class="chip s-na">판정 버림</span> <span class="hint">${esc(d.status)} 판정을 냈으나 ${esc(d.discard_reason)}</span>${d.quote ? `<blockquote>“${esc(d.quote)}”</blockquote>` : ""}<div class="hint">${esc(d.reason)}</div>`;
    const r = (t.grader_raw?.[gi] || []).find(j => norm(j?.unit) === u);
    if (r) return `${chip("미확인")}<div class="hint">${esc(r.reason || "답변만으로 판단할 수 없음")}</div>`;
    return `<span class="hint">이 항목을 판정하지 않음</span>`;
  };
  return `<div style="overflow-x:auto"><table><tr><th>항목</th>${t.graders.map(g => `<th style="width:38%">${esc(g)}</th>`).join("")}<th style="white-space:nowrap">결과</th></tr>
    ${units.map(u => `<tr><td style="white-space:nowrap"><b>${unitName(u)}</b></td><td>${cell(u, 0)}</td><td>${cell(u, 1)}</td>
      <td>${confirmed.has(u) ? `${chip(t.judgments.find(j => j.unit === u).status)}<div class="hint">일치 → 확정</div>`
        : (t.disagreements || []).some(d => d.unit === u) ? '<span class="chip s-unknown">불일치</span><div class="hint">확정하지 않고 다시 확인</div>'
        : `${chip("미확인")}<div class="hint">두 채점자 모두 판단 보류</div>`}</td></tr>`).join("")}
  </table></div>`;
}

// ---------- 탭 5: 학생 수준 및 피드백 ----------
// 채점기준 그래프: 개념(노드)과 원칙 간 관계(엣지). state가 있으면 그 위에 학생의 이해 수준을 색으로 입힌다.
// 투명성·설명가능성, 안전성·견고성처럼 한 원칙의 두 요소는 띠로 묶고, 그 원칙의 관계 엣지는 띠 가운데에서 나간다.
function graphSvg(state) {
  const pos = {}, n = CONCEPTS.length, R = 34;
  CONCEPTS.forEach((c, i) => { const a = (-90 + 360 / n * i) * Math.PI / 180; pos[c] = [280 + 172 * Math.cos(a), 222 + 172 * Math.sin(a)]; });
  const anchor = p => { const parts = ELEMENTS[p] || [p]; return [0, 1].map(k => parts.reduce((sum, c) => sum + pos[c][k], 0) / parts.length); };
  // state가 있을 때 그 안에 없는 항목은 학생이 말하지 않은 것이라 흐리게 그린다.
  const of = name => state ? state[name] || {absent: true} : {}, color = u => !state ? "#6b7a99" : u.absent ? ABSENT : COLOR[u.status];
  const bands = Object.entries(ELEMENTS).map(([p, [a, b]]) => {
    const [x, y] = anchor(p);
    return `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" stroke="#e4e7ee" stroke-width="${R * 2 + 18}" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="6" fill="#9aa3b5"/>`;
  }).join("");
  const edges = PAIRS.map(p => {
    const [a, b] = p.split("|").map(anchor), u = of(p), na = u.absent, sel = S.unit === p;
    const line = `x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"`;
    return `<g class="edge" onclick="pickUnit('${p}')"><line ${line} stroke="${color(u)}" stroke-width="${sel ? 8 : !state ? 3 : na ? 2 : 5}" opacity="${na ? .3 : 1}" ${u.needs_instructor ? 'stroke-dasharray="9 6"' : ""}/><line class="hit" ${line}/></g>`;
  }).join("");
  const nodes = CONCEPTS.map(c => {
    const u = of(c), na = u.absent, [x, y] = pos[c];
    return `<g class="node" onclick="pickUnit('${c}')" ><circle cx="${x}" cy="${y}" r="${R}" fill="#fff"/><circle opacity="${na ? .45 : 1}" cx="${x}" cy="${y}" r="${R}" fill="${color(u)}" stroke="${S.unit === c ? "#1d2330" : "#fff"}" stroke-width="${S.unit === c ? 4 : 3}" ${u.needs_instructor ? 'stroke-dasharray="7 5"' : ""}/><text x="${x}" y="${y}">${c}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 560 444" style="width:100%;max-width:560px;display:block;margin:0 auto">${bands}${edges}${nodes}</svg>`;
}
function unitPanel(s, rubric) {

    <div style="margin-top:8px"><button class="btn primary" onclick="run(this, override)">교수자 판정으로 저장</button></div>`;
}

function saveBlob(blob, name) {

async function downloadLevel(id) {
  const s = await api("/api/sessions/" + id);
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = recordHead(s).concat([[], ["항목", "종류", "최종 상태", "판정 출처", "확실성", "교수자 판단 필요", "교수자 판정 사유", "근거(답변 인용)", "근거로 든 채점기준", "판정 이유"]]);
  for (const u of Core.UNITS) {
    const st = s.state[u], ev = st?.evidence || [];
    rows.push([unitName(u), u.includes("|") ? "원칙 간 관계" : "개념",
      st ? st.status : "말하지 않음", st?.source || "", st && st.status === "오개념" && !st.certain ? "확실하지 않음" : "",

      [...new Set(ev.map(e => `${e.turn}턴 ${e.grader}: ${e.reason}`))].join(" / ")]);
  }
  saveBlob(new Blob(["﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n")], {type: "text/csv;charset=utf-8"}), fileBase(s) + "_학생수준.csv");

  [S.rubrics, S.courses, S.samples, S.settings, units] = await Promise.all([api("/api/rubrics"), api("/api/courses"), api("/api/samples"), api("/api/settings"), api("/api/units")]);
  ({concepts: CONCEPTS, principles: PRINCIPLES, elements: ELEMENTS, pairs: PAIRS} = units);
  if (!course()) S.courseId = S.courses[0]?.id;
  // 새로고침 전에 열려 있던 기록을 다시 연다.
  const lastId = (() => { try { return localStorage.getItem("trace.sessionId"); } catch (e) { return null; } })();
  if (lastId) { try { setSession(await api("/api/sessions/" + lastId)); } catch (e) { setSession(null); } }
  show(S.session ? (S.session.finished ? 5 : 4) : 3);
  const s = await api("/api/settings");
  if (!s.has_key) openSettings();
})();
</script>
</body>
</html>
